[package]
name = "joplin-mcp"
version = "0.1.0"
edition = "2024"
authors = ["nihilok <nihilok@jarv.dev>"]
license = "MIT"
description = "Fast, standalone Rust MCP server for Joplin's Data API"
repository = "https://github.com/nihilok/joplin-mcp"
readme = "README.md"
keywords = ["joplin", "mcp", "model-context-protocol", "notes", "ai"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.0", features = ["json"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
